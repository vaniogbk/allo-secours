name: logitrack
description: Application de location de voiture et envoi de colis
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  firebase_messaging: ^14.7.19
  flutter_local_notifications: ^16.3.2

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^13.2.0

  # UI
  google_fonts: ^6.2.1
  shimmer: ^3.0.0
  fl_chart: ^0.67.0
  table_calendar: ^3.1.1
  cached_network_image: ^3.3.1

  # Cloudinary — stockage images gratuit
  http: ^1.2.1
  http_parser: ^4.0.2

  # Utilitaires
  image_picker: ^1.0.7
  intl: ^0.19.0
  uuid: ^4.3.3
  url_launcher: ^6.2.6
  qr_flutter: ^4.1.0
  path: ^1.9.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/